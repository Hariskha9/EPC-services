<!-- Top Navigation Header -->
<header
  class="fixed top-0 left-0 right-0 z-50 transition-all duration-300"
  [ngClass]="scrolled ? 'bg-white shadow-md' : 'bg-white/95 backdrop-blur-sm'"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6">
    <!-- Top utility bar -->
    <div class="hidden md:flex items-center justify-end gap-6 py-2 border-b border-gray-100 text-sm">
      <a
        href="tel:+447498043736"
        class="flex items-center gap-1.5 text-gray-600 hover:text-[#17A34C] transition-colors font-medium"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
        </svg>
        +44 7498 043736
      </a>
      <a
        href="https://wa.me/447498043736?text=Hello%2C%20I%20would%20like%20to%20book%20a%20residential%20EPC%20in%20London.%20Please%20can%20you%20provide%20availability%3F"
        target="_blank"
        rel="noopener noreferrer"
        class="flex items-center gap-1.5 text-[#25D366] hover:text-[#1da855] transition-colors font-medium"
      >
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z" />
        </svg>
        WhatsApp
      </a>
      <span class="text-gray-400">Mon–Sat 9am–6pm</span>
    </div>

    <!-- Main nav -->
    <div class="flex items-center justify-between h-16">
      <a routerLink="/" class="flex items-center gap-2">
        <!-- <div class="flex items-center justify-center w-9 h-9 bg-[#17A34C] rounded-lg">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
        </div>
        <span
          class="font-display text-lg text-[#1a1a1a] leading-none"
          style="font-family: 'Outfit', sans-serif; font-weight: 800;"
        >
          EPC <span class="text-[#17A34C]">LONDON</span> UK
        </span> -->

        <img src="epclogo.png" alt="" width="130">
      </a>

      <!-- Desktop nav links -->
      <nav class="hidden md:flex items-center gap-1">
        @for (link of navLinks; track link.to) {
          <a
            [routerLink]="link.to"
            routerLinkActive="text-[#17A34C] bg-[#e8f7ee]"
            [routerLinkActiveOptions]="{ exact: link.to === '/' }"
            class="px-4 py-2 rounded-lg text-sm font-medium transition-colors text-gray-600 hover:text-[#17A34C] hover:bg-gray-50"
          >
            {{ link.label }}
          </a>
        }
      </nav>

      <!-- Desktop CTAs -->
      <div class="hidden md:flex items-center gap-3">
        <a
          href="tel:+447498043736"
          class="px-4 py-2 rounded-lg border border-[#17A34C] text-[#17A34C] text-sm font-semibold hover:bg-[#e8f7ee] transition-colors"
        >
          Call Now
        </a>
        <a
          routerLink="/contact"
          class="px-4 py-2 rounded-lg bg-[#17A34C] text-white text-sm font-semibold hover:bg-[#0f7a38] transition-colors"
        >
          Book Your EPC
        </a>
      </div>

      <!-- Mobile hamburger toggle button -->
      <button
        (click)="toggleMenu()"
        class="md:hidden p-2 rounded-lg text-gray-600 hover:bg-gray-100"
        aria-label="Toggle menu"
      >
        @if (menuOpen) {
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        } @else {
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        }
      </button>
    </div>
  </div>

  <!-- Mobile collapsible drawer -->
  @if (menuOpen) {
    <div class="md:hidden bg-white border-t border-gray-100 px-4 py-4 space-y-2">
      @for (link of navLinks; track link.to) {
        <a
          [routerLink]="link.to"
          routerLinkActive="text-[#17A34C] bg-[#e8f7ee]"
          [routerLinkActiveOptions]="{ exact: link.to === '/' }"
          class="block px-4 py-3 rounded-lg text-sm font-medium transition-colors text-gray-700 hover:bg-gray-50"
        >
          {{ link.label }}
        </a>
      }
      <div class="pt-2 flex flex-col gap-2">
        <a
          href="tel:+447498043736"
          class="block text-center px-4 py-3 rounded-lg border border-[#17A34C] text-[#17A34C] font-semibold text-sm"
        >
          Call +44 7498 043736
        </a>
        <a
          routerLink="/contact"
          class="block text-center px-4 py-3 rounded-lg bg-[#17A34C] text-white font-semibold text-sm"
        >
          Book Your EPC
        </a>
      </div>
    </div>
  }
</header>

</div>
